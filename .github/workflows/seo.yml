name: SEO checks

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/build.mjs
      - run: node --test tests/seo.mjs tests/indexnow.mjs
      - name: Check generated pages are committed
        run: git diff --exit-code
