name: IndexNow ping

# Read URLs from the sitemap and wait until this revision is live before sending.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - sitemap.xml
      - llms.txt
      - data.js
      - scripts/indexnow.mjs
      - .github/workflows/indexnow.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for Pages and notify IndexNow
        run: node scripts/indexnow.mjs
